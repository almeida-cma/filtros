<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Filtros de Fantasia — Halloween</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0b14;
    --panel: #1a1726;
    --panel2: #241f33;
    --accent: #b06cff;
    --accent2: #ff7a33;
    --accent2-dark: #d9521c;
    --danger: #e25c5c;
    --ok: #4ad27a;
    --text: #ece9f5;
    --muted: #9b93b8;
    --border: #322b47;
    --border2: #3d3556;
    --radius: 12px;
  }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #2a1c40 0%, transparent 60%),
      radial-gradient(800px 400px at 90% 110%, #1d1230 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "ss01", "cv11";
  }
  #stage, #panel, #filters-scroll, .btn, #btn-capture { user-select: none; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(20, 17, 30, 0.85);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    flex-shrink: 0;
    z-index: 5;
  }
  header h1 {
    font-size: 1.02rem;
    font-weight: 800;
    letter-spacing: 0.4px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header h1 span { color: var(--accent2); }
  header .spacer { margin-left: auto; }

  .btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border2);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn:hover { background: #332b4a; border-color: #4a4068; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #7a3ee0);
    border-color: transparent;
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); background: #322a4d; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 10px;
    gap: 10px;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    -webkit-transform: scaleX(-1);
  }
  body.no-mirror #stage video { transform: none; -webkit-transform: none; }

  #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #stage .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    background: radial-gradient(circle at 50% 40%, #241a38 0%, #0d0b14 70%);
    z-index: 2;
  }
  #stage .placeholder .icon { font-size: 3rem; opacity: 0.85; }
  #stage .placeholder p { max-width: 340px; line-height: 1.45; }

  #countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 8rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px var(--accent2), 0 0 60px var(--accent);
    z-index: 20;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #countdown.show { display: flex; animation: pulse 0.9s ease; }
  @keyframes pulse {
    0%   { transform: scale(1.4); opacity: 0; }
    30%  { transform: scale(1);   opacity: 1; }
    100% { transform: scale(0.85); opacity: 0; }
  }

  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
  }
  #flash.fire { animation: flashAnim 0.35s ease-out; }
  @keyframes flashAnim {
    0%   { opacity: 0.9; }
    100% { opacity: 0; }
  }

  #panel {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
  }

  #filters-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    gap: 8px;
    padding: 2px 2px 6px;
    scrollbar-width: thin;
    scrollbar-color: #4a3f66 transparent;
    min-height: 0;
  }
  #filters-scroll::-webkit-scrollbar { height: 6px; }
  #filters-scroll::-webkit-scrollbar-thumb { background: #4a3f66; border-radius: 3px; }
  #filters-scroll::-webkit-scrollbar-track { background: transparent; }

  .filter-btn {
    flex: 0 0 auto;
    width: 92px;
    background: var(--panel2);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 8px 6px;
    cursor: pointer;
    color: var(--text);
    font-size: 0.72rem;
    font-weight: 600;
    text-align: center;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .filter-btn:hover { background: #2e2743; }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filter-btn.active { border-color: var(--accent); background: #322a4d; }
  .filter-btn .emoji { font-size: 1.6rem; line-height: 1; }

  #controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: center;
    min-width: 210px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .ctrl-row label { flex: 0 0 76px; }
  .ctrl-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
    cursor: pointer;
  }
  .ctrl-row input[type="color"] {
    width: 32px;
    height: 26px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .ctrl-row .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.7rem;
    min-width: 40px;
    text-align: right;
    color: var(--text);
  }

  #capture-row { display: flex; gap: 8px; align-items: stretch; }
  #btn-capture {
    flex: 1;
    background: linear-gradient(135deg, var(--accent2), #ff9a5c);
    border: none;
    color: #2a1204;
    font-weight: 800;
    padding: 13px;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,122,51,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.1s ease, box-shadow 0.15s ease, filter 0.15s ease;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  #btn-capture:hover { filter: brightness(1.06); box-shadow: 0 8px 24px rgba(255,122,51,0.4), inset 0 1px 0 rgba(255,255,255,0.35); }
  #btn-capture:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(255,122,51,0.35), inset 0 1px 0 rgba(255,255,255,0.35); }
  #btn-capture:focus-visible { outline: 2px solid #ffd7bc; outline-offset: 2px; }
  #btn-capture:disabled { opacity: 0.45; box-shadow: none; cursor: not-allowed; filter: grayscale(0.4); }

  #face-status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #face-status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #666;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #face-status.ok   .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #face-status.warn .dot { background: #f5b93e; }

  #result-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
    flex-direction: column;
    gap: 14px;
  }
  #result-modal.open { display: flex; }
  #result-modal img {
    max-width: 92vw;
    max-height: 72vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    object-fit: contain;
  }
  #result-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ok);
    color: #06210f;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err  { background: var(--danger); color: #fff; }

  @media (max-width: 720px) {
    #panel {
      grid-template-columns: 1fr;
      grid-template-rows: min-content auto;
    }
    #controls {
      flex-direction: row;
      flex-wrap: wrap;
      min-width: 0;
      justify-content: flex-start;
    }
    .ctrl-row { flex: 1 1 45%; }
    #capture-row { flex: 1 1 100%; }
    header h1 { font-size: 0.92rem; }
    .btn { padding: 6px 10px; font-size: 0.78rem; }
    #countdown { font-size: 6rem; }
  }

  @media (max-height: 560px) {
    #panel { padding: 8px; }
    #controls { gap: 6px; }
    .ctrl-row { font-size: 0.7rem; }
    #btn-capture { padding: 10px; font-size: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  body.cam-on #placeholder { display: none; }
</style>
</head>
<body>

<header>
  <h1>🎃 Filtros de <span>Fantasia</span></h1>
  <div class="spacer"></div>
  <button class="btn" id="btn-mirror" type="button" aria-pressed="true" title="Espelhar imagem" aria-label="Espelhar imagem">🔁</button>
  <button class="btn" id="btn-timer" type="button" title="Contagem regressiva">⏱️ <span id="timer-label">off</span></button>
  <button class="btn" id="btn-camera" type="button" title="Alternar câmera" aria-label="Alternar câmera">📷</button>
</header>

<main>
  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>

    <div class="placeholder" id="placeholder">
      <div class="icon" aria-hidden="true">🎃</div>
      <p><b>Toque em "Iniciar câmera"</b> para começar.<br>
      Funciona no notebook (Windows/macOS/Linux) e no Android.</p>
      <button class="btn primary" id="btn-start" type="button" style="padding:12px 22px;font-size:1rem;">
        ▶ Iniciar câmera
      </button>
      <input type="file" id="file-fallback" accept="image/*" capture="user" hidden>
    </div>

    <div id="face-status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="face-status-text">Rosto: —</span>
    </div>

    <div id="countdown" aria-hidden="true">3</div>
    <div id="flash" aria-hidden="true"></div>
  </div>

  <div id="panel">
    <div id="filters-scroll" role="tablist" aria-label="Filtros disponíveis"></div>

    <div id="controls">
      <div class="ctrl-row">
        <label for="intensity">Intensidade</label>
        <input type="range" id="intensity" min="0" max="100" value="70">
        <span class="val" id="intensity-val">70</span>
      </div>
      <div class="ctrl-row">
        <label for="opacity">Opacidade</label>
        <input type="range" id="opacity" min="10" max="100" value="90">
        <span class="val" id="opacity-val">90</span>
      </div>
      <div class="ctrl-row">
        <label for="color">Cor</label>
        <input type="color" id="color" value="#ff6b35">
        <span class="val" id="color-val">#ff6b35</span>
      </div>
      <div id="capture-row">
        <button id="btn-capture" type="button" disabled>📸 Capturar</button>
        <button class="btn" id="btn-upload" type="button" title="Enviar foto da galeria" aria-label="Enviar foto da galeria">🖼️</button>
      </div>
    </div>
  </div>
</main>

<div id="result-modal" role="dialog" aria-modal="true" aria-label="Resultado da captura">
  <img id="result-img" alt="Resultado da captura">
  <div id="result-actions">
    <button class="btn primary" id="btn-download" type="button">⬇ Baixar PNG</button>
    <button class="btn" id="btn-again" type="button">🔁 Tirar outra</button>
    <button class="btn" id="btn-close-result" type="button">✖ Fechar</button>
  </div>
</div>

<input type="file" id="file-upload" accept="image/*" hidden>
<div id="toast" role="alert" aria-live="assertive"></div>

<script type="module">
/* =========================================================================
   Filtros de Fantasia — Halloween
   Substituições nesta versão:
   - Bruxa  → Múmia 🧻 (máscara, withFace)
   - Diabo  → Duende 🧝 (orelhas em withTopAnchor + rosto em withFace)
   - Neon   → Alien 👽 (máscara, withFace)
   ========================================================================= */

import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12";

const MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const WASM_URL =
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.12/wasm";
const CAPTURE_MAX_SIDE = 1920;
const TIMER_OPTIONS = [0, 3, 5, 10];
const MIN_CAPTURE_SHORT_SIDE = 720;
const TOAST_DURATION_MS = 2400;
const TOAST_ERROR_DURATION_MS = 4800;

/* ------------------------------- DOM ----------------------------------- */
const $video        = document.getElementById('video');
const $overlay      = document.getElementById('overlay');
const ctx           = $overlay.getContext('2d');
const $stage        = document.getElementById('stage');
const $placeholder  = document.getElementById('placeholder');
const $btnStart     = document.getElementById('btn-start');
const $btnCamera    = document.getElementById('btn-camera');
const $btnMirror    = document.getElementById('btn-mirror');
const $btnTimer     = document.getElementById('btn-timer');
const $timerLabel   = document.getElementById('timer-label');
const $btnCapture   = document.getElementById('btn-capture');
const $btnUpload    = document.getElementById('btn-upload');
const $faceStatus   = document.getElementById('face-status');
const $faceText     = document.getElementById('face-status-text');
const $countdown    = document.getElementById('countdown');
const $flash        = document.getElementById('flash');
const $filtersScroll= document.getElementById('filters-scroll');
const $intensity    = document.getElementById('intensity');
const $intensityVal = document.getElementById('intensity-val');
const $opacity      = document.getElementById('opacity');
const $opacityVal   = document.getElementById('opacity-val');
const $color        = document.getElementById('color');
const $colorVal     = document.getElementById('color-val');
const $toast        = document.getElementById('toast');
const $resultModal  = document.getElementById('result-modal');
const $resultImg    = document.getElementById('result-img');
const $fileUpload   = document.getElementById('file-upload');
const $fileFallback = document.getElementById('file-fallback');

/* ------------------------------- Estado -------------------------------- */
const state = {
  stream: null,
  facingMode: 'user',
  mirror: true,
  timer: 0,
  filter: 'none',
  intensity: 70,
  opacity: 90,
  color: '#ff6b35',
  landmarker: null,
  landmarkerLoading: null,
  lastVideoTime: -1,
  faces: [],
  running: false,
  rafId: null,
  capturing: false,
  staticImage: null,
  dpr: window.devicePixelRatio || 1
};

/* ------------------------------ Utilidades ----------------------------- */
const toastTimers = new WeakMap();

function toast(msg, isError = false) {
  $toast.textContent = msg;
  $toast.classList.toggle('err', isError);
  $toast.classList.add('show');
  const prev = toastTimers.get($toast);
  if (prev) clearTimeout(prev);
  const ms = isError ? TOAST_ERROR_DURATION_MS : TOAST_DURATION_MS;
  toastTimers.set($toast, setTimeout(() => $toast.classList.remove('show'), ms));
}

function hexToRgb(hex) {
  let h = hex.replace('#', '').trim();
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (h.length !== 6 || !/^[0-9a-fA-F]{6}$/.test(h)) return { r: 255, g: 107, b: 53 };
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgba(hex, a = 1) {
  const { r, g, b } = hexToRgb(hex);
  const alpha = Math.max(0, Math.min(1, a));
  return `rgba(${r},${g},${b},${alpha})`;
}

function mixHex(hex, target, t) {
  const a = hexToRgb(hex);
  const b = hexToRgb(target);
  const m = v1 => Math.round(v1);
  const r = m(a.r + (b.r - a.r) * t);
  const g = m(a.g + (b.g - a.g) * t);
  const bl = m(a.b + (b.b - a.b) * t);
  return `rgb(${r},${g},${bl})`;
}

function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

/* ------------------------- Geometria centralizada ---------------------- */
function fitCover(srcW, srcH, dstW, dstH) {
  if (!srcW || !srcH || !dstW || !dstH) {
    return { scale: 1, dw: dstW || 1, dh: dstH || 1, dx: 0, dy: 0 };
  }
  const scale = Math.max(dstW / srcW, dstH / srcH);
  const dw = srcW * scale;
  const dh = srcH * scale;
  return { scale, dw, dh, dx: (dstW - dw) / 2, dy: (dstH - dh) / 2 };
}

function landmarksToStage(landmarks, srcW, srcH, dstW, dstH, mirror) {
  const fit = fitCover(srcW, srcH, dstW, dstH);
  const out = new Array(landmarks.length);
  for (let i = 0; i < landmarks.length; i++) {
    const lm = landmarks[i];
    const sx = fit.dx + lm.x * fit.dw;
    const sy = fit.dy + lm.y * fit.dh;
    out[i] = { x: mirror ? dstW - sx : sx, y: sy };
  }
  return out;
}

function eyeCenters(p) {
  return {
    left:  { x: (p[33].x + p[133].x) / 2,  y: (p[33].y + p[133].y) / 2  },
    right: { x: (p[362].x + p[263].x) / 2, y: (p[362].y + p[263].y) / 2 }
  };
}

function mouthCenter(p) {
  return { x: (p[13].x + p[14].x) / 2, y: (p[13].y + p[14].y) / 2 };
}

function faceAngle(p) {
  const l = p[33];
  const r = p[263];
  return Math.atan2(r.y - l.y, r.x - l.x);
}

function computeFaceContext(p) {
  const cx = (p[234].x + p[454].x) / 2;
  const cy = (p[10].y + p[152].y) / 2;
  const fw = dist(p[234], p[454]);
  const fh = dist(p[10], p[152]);
  const ang = faceAngle(p);

  const eyes = eyeCenters(p);
  const eyeCenterX = (eyes.left.x + eyes.right.x) / 2;
  const eyeCenterY = (eyes.left.y + eyes.right.y) / 2;
  const topAnchor = {
    x: eyeCenterX,
    y: eyeCenterY - fh * 0.42
  };

  return {
    cx, cy, fw, fh, ang,
    eyes,
    mouth: mouthCenter(p),
    nose: p[1],
    top: p[10],
    chin: p[152],
    topAnchor
  };
}

function toLocal(pt, fc) {
  const dx = pt.x - fc.cx;
  const dy = pt.y - fc.cy;
  const c = Math.cos(-fc.ang);
  const s = Math.sin(-fc.ang);
  return { x: dx * c - dy * s, y: dx * s + dy * c };
}

/* -------------------------- Filtros disponíveis ------------------------ */
const FILTERS = [
  { id: 'none',     name: 'Sem filtro',  emoji: '🚫' },
  { id: 'pumpkin',  name: 'Abóbora',     emoji: '🎃' },
  { id: 'skull',    name: 'Caveira',     emoji: '💀' },
  { id: 'vampire',  name: 'Vampiro',     emoji: '🧛' },
  { id: 'mummy',    name: 'Múmia',       emoji: '🧻' },
  { id: 'zombie',   name: 'Zumbi',       emoji: '🧟' },
  { id: 'cat',      name: 'Gato',        emoji: '🐱' },
  { id: 'clown',    name: 'Palhaço',     emoji: '🤡' },
  { id: 'ghost',    name: 'Fantasma',    emoji: '👻' },
  { id: 'goblin',   name: 'Duende',      emoji: '🧝' },
  { id: 'skeleton', name: 'Esqueleto',   emoji: '☠️' },
  { id: 'alien',    name: 'Alien',       emoji: '👽' },
  { id: 'glow',     name: 'Olhos Glow',  emoji: '✨' }
];

function buildFilterButtons() {
  const frag = document.createDocumentFragment();
  for (const f of FILTERS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'filter-btn' + (f.id === state.filter ? ' active' : '');
    b.dataset.id = f.id;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', f.id === state.filter ? 'true' : 'false');
    b.innerHTML = `<span class="emoji" aria-hidden="true">${f.emoji}</span><span>${f.name}</span>`;
    b.addEventListener('click', () => selectFilter(f.id));
    frag.appendChild(b);
  }
  $filtersScroll.appendChild(frag);
}

function selectFilter(id) {
  state.filter = id;
  const buttons = $filtersScroll.querySelectorAll('.filter-btn');
  for (const b of buttons) {
    const on = b.dataset.id === id;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  }
}

buildFilterButtons();

$btnTimer.addEventListener('click', () => {

/* -------------------------- Inicialização modelo ----------------------- */
async function initLandmarker() {
  if (state.landmarker) return state.landmarker;
  if (state.landmarkerLoading) return state.landmarkerLoading;

  state.landmarkerLoading = (async () => {
    try {
      const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
      const landmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
        runningMode: 'VIDEO',
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false
      });
      state.landmarker = landmarker;
      toast('Modelo de rosto carregado ✅');
      return landmarker;
    } catch (err) {
      console.warn('[initLandmarker] fallback CPU', err);
      try {
        const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
        const landmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
          runningMode: 'VIDEO',
          numFaces: 1
        });
        state.landmarker = landmarker;
        toast('Modelo carregado (modo CPU) ✅');
        return landmarker;
      } catch (err2) {
        console.error('[initLandmarker] falha definitiva', err2);
        toast('Falha ao carregar modelo — verifique a conexão', true);
        throw err2;
      }
    } finally {
      state.landmarkerLoading = null;
    }
  })();

  return state.landmarkerLoading;
}

/* ------------------------------- Câmera -------------------------------- */
async function startCamera(facing = state.facingMode) {
  stopCamera();
  state.facingMode = facing;
  state.staticImage = null;
  $placeholder.style.display = '';
  document.body.classList.remove('cam-on');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Este navegador não expõe câmera. Envie uma foto.', true);
    $fileFallback.click();
    return;
  }

  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
  } catch (err) {
    console.warn('[startCamera] getUserMedia falhou', err);
    if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
      toast('Permissão de câmera negada. Libere no navegador ou envie uma foto.', true);
    } else {
      toast('Não foi possível abrir a câmera. Tente enviar uma foto.', true);
    }
    $fileFallback.click();
    return;
  }

  state.stream = stream;
  $video.srcObject = stream;

  try {
    await $video.play();
  } catch (err) {
    console.warn('[startCamera] play falhou', err);
    toast('Não foi possível iniciar a prévia do vídeo.', true);
    stopCamera();
    return;
  }

  try {
    await initLandmarker();
  } catch {
    stopCamera();
    return;
  }

  document.body.classList.add('cam-on');
  $btnCapture.disabled = false;

  resizeCanvas();
  state.running = true;
  state.lastVideoTime = -1;
  loopDetect();
  toast('Câmera ativa 📷');
}

function stopCamera() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = null;

  if (state.stream) {
    for (const track of state.stream.getTracks()) track.stop();
    state.stream = null;
  }
  $video.srcObject = null;

  state.faces = [];
  state.lastVideoTime = -1;
  ctx.clearRect(0, 0, $overlay.width, $overlay.height);

  $btnCapture.disabled = true;
  document.body.classList.remove('cam-on');
}

$btnStart.addEventListener('click', () => startCamera());

$btnCamera.addEventListener('click', () => {
  const next = state.facingMode === 'user' ? 'environment' : 'user';
  $fileFallback.setAttribute('capture', next);
  startCamera(next);
});

/* --------------------------- Fallback por arquivo ---------------------- */
async function loadImageFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.decoding = 'async';
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('Falha ao decodificar imagem'));
      img.src = url;
    });

    stopCamera();
    state.staticImage = img;
    document.body.classList.add('cam-on');
    $placeholder.style.display = 'none';
    $btnCapture.disabled = false;

    try {
      await initLandmarker();
    } catch {
      return;
    }

    resizeCanvas();
    renderStaticImage(img);
    toast('Foto carregada. Aplique o filtro e capture.');
  } catch (err) {
    console.error('[loadImageFile]', err);
    toast('Não foi possível ler esta imagem.', true);
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }
}

$fileFallback.addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  e.target.value = '';
  loadImageFile(f);
});

$btnUpload.addEventListener('click', () => $fileUpload.click());

$fileUpload.addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  e.target.value = '';
  loadImageFile(f);
});

/* ------------------------------- Resize -------------------------------- */
function resizeCanvas() {
  const rect = $stage.getBoundingClientRect();
  const cssW = Math.max(1, Math.round(rect.width));
  const cssH = Math.max(1, Math.round(rect.height));
  state.dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

  $overlay.width  = Math.round(cssW * state.dpr);
  $overlay.height = Math.round(cssH * state.dpr);
  $overlay.style.width  = cssW + 'px';
  $overlay.style.height = cssH + 'px';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(state.dpr, state.dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}

let resizeScheduled = false;
function scheduleResize() {
  if (resizeScheduled) return;
  resizeScheduled = true;
  requestAnimationFrame(() => {
    resizeScheduled = false;
    resizeCanvas();
    if (state.staticImage) renderStaticImage(state.staticImage);
  });
}
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);

/* --------------------------- Loop de detecção ------------------------- */
function loopDetect() {
  if (!state.running) return;

  const now = performance.now();
  if (state.landmarker && $video.readyState >= 2 && $video.currentTime !== state.lastVideoTime) {
    state.lastVideoTime = $video.currentTime;
    try {
      const res = state.landmarker.detectForVideo($video, now);
      state.faces = res.faceLandmarks || [];
    } catch (err) {
      if (!(err && err.name === 'InvalidStateError')) {
        console.warn('[loopDetect] detect falhou', err);
      }
    }
  }

  updateFaceStatus();
  drawPreview();
  state.rafId = requestAnimationFrame(loopDetect);
}

function updateFaceStatus() {
  const has = state.faces.length > 0;
  $faceStatus.classList.toggle('ok', has);
  $faceStatus.classList.toggle('warn', !has && state.running);
  $faceText.textContent = has
    ? 'Rosto detectado ✅'
    : (state.running ? 'Procure um rosto…' : 'Rosto: —');
}

function drawPreview() {
  const rect = $stage.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  ctx.clearRect(0, 0, W, H);

  if (state.faces.length === 0) return;
  const srcW = $video.videoWidth;
  const srcH = $video.videoHeight;
  if (!srcW || !srcH) return;

  for (const face of state.faces) {
    const pts = landmarksToStage(face, srcW, srcH, W, H, state.mirror);
    drawFilter(ctx, pts, W, H, state);
  }
}

function renderStaticImage(img) {
  resizeCanvas();
  const rect = $stage.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;

  ctx.clearRect(0, 0, W, H);

  const fit = fitCover(img.width, img.height, W, H);
  ctx.save();
  if (state.mirror) {
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
  ctx.restore();

  if (!state.landmarker) return;

  try {
    const res = state.landmarker.detect(img);
    state.faces = res.faceLandmarks || [];
  } catch (err) {
    console.warn('[renderStaticImage] detect falhou', err);
    state.faces = [];
  }

  updateFaceStatus();

  for (const face of state.faces) {
    const pts = landmarksToStage(face, img.width, img.height, W, H, state.mirror);
    drawFilter(ctx, pts, W, H, state);
  }
}

/* =========================================================================
   FILTROS — helpers de referencial
   ========================================================================= */
function withFace(c, fc, fn) {
  c.save();
  c.translate(fc.cx, fc.cy);
  c.rotate(fc.ang);
  try { fn(); } finally { c.restore(); }
}

function withTopAnchor(c, fc, fn) {
  c.save();
  c.translate(fc.topAnchor.x, fc.topAnchor.y);
  c.rotate(fc.ang);
  try { fn(); } finally { c.restore(); }
}

function drawFilter(c, p, W, H, st) {
  if (st.filter === 'none') return;
  if (!p || p.length < 468) return;

  const I = Math.max(0, Math.min(1, st.intensity / 100));
  const A = Math.max(0, Math.min(1, st.opacity / 100));
  const color = st.color;
  const id = st.filter;

  const fc = computeFaceContext(p);

  c.save();
  c.globalAlpha = A;
  c.lineJoin = 'round';
  c.lineCap = 'round';

  switch (id) {
    case 'pumpkin':    drawPumpkin(c, p, fc, color, I);    break;
    case 'skull':      drawSkull(c, p, fc, color, I);      break;
    case 'vampire':    drawVampire(c, p, fc, color, I);    break;
    case 'mummy':      drawMummy(c, p, fc, color, I);      break;
    case 'zombie':     drawZombie(c, p, fc, color, I);     break;
    case 'cat':        drawCat(c, p, fc, color, I);        break;
    case 'clown':      drawClown(c, p, fc, color, I);      break;
    case 'ghost':      drawGhost(c, p, fc, color, I);      break;
    case 'goblin':     drawGoblin(c, p, fc, color, I);     break;
    case 'skeleton':   drawSkeleton(c, p, fc, color, I);   break;
    case 'alien':      drawAlien(c, p, fc, color, I);      break;
    case 'glow':       drawGlow(c, p, fc, color, I);       break;
  }

  c.restore();
}

/* ------------------------------ Abóbora -------------------------------- */
function drawPumpkin(c, p, fc, color, I) {
  const rx = fc.fw * 0.62;
  const ry = fc.fh * 0.62;

  withFace(c, fc, () => {
    const grd = c.createRadialGradient(0, 0, rx * 0.2, 0, 0, rx);
    grd.addColorStop(0, mixHex(color, '#ffb066', 0.5));
    grd.addColorStop(1, mixHex(color, '#5a1d00', 0.45));
    c.fillStyle = grd;
    c.globalAlpha *= 0.55 * I;
    c.beginPath();
    c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    c.fill();

    c.globalAlpha = I;
    c.strokeStyle = 'rgba(120,40,0,0.6)';
    c.lineWidth = Math.max(2, rx * 0.03);
    for (let k = -2; k <= 2; k++) {
      c.beginPath();
      c.ellipse(0, 0, rx * (0.25 + Math.abs(k) * 0.18), ry, 0, 0, Math.PI * 2);
      c.stroke();
    }

    c.fillStyle = '#1a0a00';
    const eyeR = rx * 0.18;
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.beginPath();
      c.moveTo(ep.x - eyeR, ep.y - eyeR * 0.7);
      c.lineTo(ep.x + eyeR, ep.y - eyeR * 0.7);
      c.lineTo(ep.x, ep.y + eyeR * 0.7);
      c.closePath();
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    c.beginPath();
    c.moveTo(mp.x - rx * 0.28, mp.y - ry * 0.1);
    c.lineTo(mp.x - rx * 0.12, mp.y + ry * 0.12);
    c.lineTo(mp.x - rx * 0.02, mp.y - ry * 0.05);
    c.lineTo(mp.x + rx * 0.08, mp.y + ry * 0.14);
    c.lineTo(mp.x + rx * 0.2,  mp.y - ry * 0.05);
    c.lineTo(mp.x + rx * 0.3,  mp.y + ry * 0.1);
    c.lineTo(mp.x + rx * 0.3,  mp.y + ry * 0.25);
    c.lineTo(mp.x - rx * 0.28, mp.y + ry * 0.25);
    c.closePath();
    c.fillStyle = '#1a0a00';
    c.fill();

    c.fillStyle = '#2e7d32';
    c.beginPath();
    c.ellipse(0, -ry * 0.95, rx * 0.08, ry * 0.12, 0, 0, Math.PI * 2);
    c.fill();
  });
}

/* ------------------------------ Caveira -------------------------------- */
function drawSkull(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha *= 0.78 * I;

    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.fillStyle = 'rgba(0,0,0,0.88)';
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.13, fh * 0.10, 0, 0, Math.PI * 2);
      c.fill();

      const g = c.createRadialGradient(ep.x, ep.y, 1, ep.x, ep.y, fw * 0.13);
      g.addColorStop(0, rgba(color, 0.9));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.13, fh * 0.10, 0, 0, Math.PI * 2);
      c.fill();
    }

    const np = toLocal(fc.nose, fc);
    c.fillStyle = 'rgba(0,0,0,0.8)';
    c.beginPath();
    c.moveTo(np.x, np.y - fh * 0.04);
    c.lineTo(np.x - fw * 0.05, np.y + fh * 0.06);
    c.lineTo(np.x + fw * 0.05, np.y + fh * 0.06);
    c.closePath();
    c.fill();

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = 'rgba(0,0,0,0.85)';
    c.lineWidth = Math.max(2, fw * 0.02);
    const tw = fw * 0.42;
    const th = fh * 0.13;
    c.strokeRect(mp.x - tw / 2, mp.y - th / 2, tw, th);
    for (let i = 1; i < 5; i++) {
      const x = mp.x - tw / 2 + (tw / 5) * i;
      c.beginPath(); c.moveTo(x, mp.y - th / 2); c.lineTo(x, mp.y + th / 2); c.stroke();
    }
    c.beginPath(); c.moveTo(mp.x - tw / 2, mp.y); c.lineTo(mp.x + tw / 2, mp.y); c.stroke();
  });
}

/* ------------------------------ Vampiro -------------------------------- */
function drawVampire(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const mp = toLocal(fc.mouth, fc);
    const fangLen = fh * 0.09;
    const mouthW = fw * 0.22;

    c.fillStyle = '#fff';
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.lineWidth = 1;
    for (const sign of [-1, 1]) {
      const baseX = mp.x + sign * mouthW * 0.35;
      const baseY = mp.y + fh * 0.02;
      c.beginPath();
      c.moveTo(baseX - fw * 0.02, baseY);
      c.lineTo(baseX + fw * 0.02, baseY);
      c.lineTo(baseX, baseY + fangLen);
      c.closePath();
      c.fill();
      c.stroke();
    }

    c.fillStyle = 'rgba(180,0,0,0.85)';
    const dripX = mp.x + fw * 0.08;
    c.beginPath();
    c.moveTo(dripX, mp.y + fh * 0.05);
    c.quadraticCurveTo(dripX + fw * 0.03, mp.y + fh * 0.15, dripX, mp.y + fh * 0.22);
    c.quadraticCurveTo(dripX - fw * 0.03, mp.y + fh * 0.15, dripX, mp.y + fh * 0.05);
    c.fill();

    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      const g = c.createRadialGradient(ep.x, ep.y, 1, ep.x, ep.y, fw * 0.08);
      g.addColorStop(0, 'rgba(255,40,40,0.95)');
      g.addColorStop(1, 'rgba(120,0,0,0)');
      c.fillStyle = g;
      c.beginPath();
      c.arc(ep.x, ep.y, fw * 0.08, 0, Math.PI * 2);
      c.fill();
    }

    c.globalAlpha = 0.15 * I;
    c.fillStyle = mixHex(color, '#e8e0f0', 0.6);
    c.beginPath();
    c.ellipse(0, 0, fw * 0.55, fh * 0.55, 0, 0, Math.PI * 2);
    c.fill();
  });
}

/* -------------------------------- Múmia -------------------------------- */
function drawMummy(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const bandColor   = mixHex(color, '#efe6cf', 0.85);
    const bandAlt     = mixHex(color, '#d9cba6', 0.70);
    const bandShadow  = 'rgba(60,45,25,0.45)';
    const rx = fw * 0.58;
    const ry = fh * 0.60;

    c.fillStyle = bandColor;
    c.beginPath();
    c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    c.fill();

    const bands = 7;
    for (let i = 0; i < bands; i++) {
      const t = i / (bands - 1);
      const y = -ry * 0.85 + ry * 1.7 * t;
      const tilt = (i % 2 === 0 ? 1 : -1) * fh * 0.05;
      const width = rx * 2.05;

      c.fillStyle = i % 2 === 0 ? bandColor : bandAlt;
      c.beginPath();
      c.moveTo(-width / 2, y - fh * 0.035);
      c.lineTo(width / 2, y - fh * 0.035 + tilt);
      c.lineTo(width / 2, y + fh * 0.035 + tilt);
      c.lineTo(-width / 2, y + fh * 0.035);
      c.closePath();
      c.fill();

      c.strokeStyle = bandShadow;
      c.lineWidth = Math.max(1, fw * 0.008);
      c.beginPath();
      c.moveTo(-width / 2, y + fh * 0.04);
      c.lineTo(width / 2, y + fh * 0.04 + tilt);
      c.stroke();
    }

    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.fillStyle = 'rgba(0,0,0,0.92)';
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.10, fh * 0.08, 0, 0, Math.PI * 2);
      c.fill();
      const g = c.createRadialGradient(ep.x, ep.y, 1, ep.x, ep.y, fw * 0.10);
      g.addColorStop(0, rgba(color, 0.85));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.10, fh * 0.08, 0, 0, Math.PI * 2);
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    const mw = fw * 0.36;
    c.strokeStyle = 'rgba(40,25,10,0.85)';
    c.lineWidth = Math.max(2, fw * 0.014);
    c.beginPath();
    c.moveTo(mp.x - mw / 2, mp.y);
    c.lineTo(mp.x + mw / 2, mp.y);
    c.stroke();
    for (let i = -3; i <= 3; i++) {
      const x = mp.x + (mw / 6) * i;
      c.beginPath();
      c.moveTo(x, mp.y - fh * 0.03);
      c.lineTo(x, mp.y + fh * 0.03);
      c.stroke();
    }
  });
}

/* -------------------------------- Zumbi -------------------------------- */
function drawZombie(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;
  const skinBase = mixHex(color, '#7acc4a', 0.65);

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const g = c.createRadialGradient(0, 0, fw * 0.1, 0, 0, fw * 0.6);
    g.addColorStop(0, skinBase);
    g.addColorStop(0.7, rgba(color, 0.35));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, fw * 0.55, fh * 0.55, 0, 0, Math.PI * 2);
    c.fill();

    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.fillStyle = 'rgba(255,220,0,0.9)';
      c.beginPath();
      c.arc(ep.x, ep.y, fw * 0.055, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(200,0,0,0.95)';
      c.beginPath();
      c.arc(ep.x, ep.y, fw * 0.025, 0, Math.PI * 2);
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = 'rgba(60,20,10,0.9)';
    c.lineWidth = Math.max(2, fw * 0.015);
    c.beginPath();
    c.moveTo(mp.x - fw * 0.20, mp.y);
    c.lineTo(mp.x + fw * 0.20, mp.y);
    c.stroke();
    for (let i = -3; i <= 3; i++) {
      const x = mp.x + i * fw * 0.06;
      c.beginPath(); c.moveTo(x, mp.y - fh * 0.05); c.lineTo(x, mp.y + fh * 0.05); c.stroke();
    }

    c.fillStyle = 'rgba(150,0,0,0.8)';
    c.beginPath();
    c.ellipse(mp.x + fw * 0.18, mp.y + fh * 0.04, fw * 0.04, fh * 0.05, 0, 0, Math.PI * 2);
    c.fill();
  });
}

/* --------------------------------- Gato -------------------------------- */
function drawCat(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;
  const inner = mixHex(color, '#ffffff', 0.55);

  withTopAnchor(c, fc, () => {
    c.globalAlpha *= I;

    for (const side of [-1, 1]) {
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(side * fw * 0.38, fh * 0.02);
      c.lineTo(side * fw * 0.55, -fh * 0.35);
      c.lineTo(side * fw * 0.18, -fh * 0.20);
      c.closePath();
      c.fill();

      c.fillStyle = inner;
      c.beginPath();
      c.moveTo(side * fw * 0.36, fh * 0.0);
      c.lineTo(side * fw * 0.48, -fh * 0.26);
      c.lineTo(side * fw * 0.24, -fh * 0.16);
      c.closePath();
      c.fill();
    }
  });

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = 'rgba(255,255,255,0.9)';
    c.lineWidth = Math.max(1.5, fw * 0.012);
    for (const side of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        c.beginPath();
        c.moveTo(mp.x + side * fw * 0.15, mp.y - fh * 0.02 + k * fh * 0.03);
        c.lineTo(mp.x + side * fw * 0.55, mp.y - fh * 0.05 + k * fh * 0.06);
        c.stroke();
      }
    }

    c.fillStyle = mixHex(color, '#ff7aa0', 0.6);
    c.beginPath();
    c.moveTo(mp.x - fw * 0.03, mp.y - fh * 0.06);
    c.lineTo(mp.x + fw * 0.03, mp.y - fh * 0.06);
    c.lineTo(mp.x, mp.y - fh * 0.02);
    c.closePath();
    c.fill();
  });
}

/* ------------------------------- Palhaço ------------------------------- */
function drawClown(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const np = toLocal(fc.nose, fc);
    c.fillStyle = '#e60023';
    c.beginPath();
    c.arc(np.x, np.y, fw * 0.09, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.6)';
    c.beginPath();
    c.arc(np.x - fw * 0.03, np.y - fh * 0.03, fw * 0.03, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = rgba(color, 0.85);
    for (const side of [-1, 1]) {
      const bx = side * fw * 0.32;
      const by = fh * 0.12;
      c.beginPath();
      c.arc(bx, by, fw * 0.10, 0, Math.PI * 2);
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = '#c20020';
    c.lineWidth = Math.max(3, fw * 0.03);
    c.beginPath();
    c.moveTo(mp.x - fw * 0.30, mp.y - fh * 0.02);
    c.quadraticCurveTo(mp.x, mp.y + fh * 0.20, mp.x + fw * 0.30, mp.y - fh * 0.02);
    c.stroke();

    c.fillStyle = '#1a1a1a';
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.beginPath();
      c.ellipse(ep.x, ep.y - fh * 0.05, fw * 0.08, fh * 0.05, 0, 0, Math.PI * 2);
      c.fill();
    }
  });
}

/* ------------------------------ Fantasma ------------------------------- */
function drawGhost(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha = 0.35 * I;
    c.fillStyle = '#e8f0ff';
    c.beginPath();
    c.ellipse(0, -fh * 0.05, fw * 0.55, fh * 0.60, 0, 0, Math.PI * 2);
    c.fill();

    c.globalAlpha = 0.9 * I;
    c.fillStyle = 'rgba(20,20,40,0.9)';
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.09, fh * 0.07, 0, 0, Math.PI * 2);
      c.fill();
    }

    const g = c.createRadialGradient(0, 0, fw * 0.2, 0, 0, fw * 0.7);
    g.addColorStop(0, rgba(color, 0.25));
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, fw * 0.7, fh * 0.7, 0, 0, Math.PI * 2);
    c.fill();
  });
}

/* -------------------------------- Duende ------------------------------- */
function drawGoblin(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;
  const earColor = mixHex(color, '#7ac74a', 0.65);
  const earInner = mixHex(color, '#c8e0a8', 0.55);

  withTopAnchor(c, fc, () => {
    c.globalAlpha *= I;

    for (const side of [-1, 1]) {
      c.fillStyle = earColor;
      c.beginPath();
      c.moveTo(side * fw * 0.30, fh * 0.05);
      c.quadraticCurveTo(
        side * fw * 0.85, -fh * 0.02,
        side * fw * 0.78, -fh * 0.35
      );
      c.quadraticCurveTo(
        side * fw * 0.48, -fh * 0.10,
        side * fw * 0.22, -fh * 0.02
      );
      c.closePath();
      c.fill();

      c.fillStyle = earInner;
      c.beginPath();
      c.moveTo(side * fw * 0.32, fh * 0.02);
      c.quadraticCurveTo(
        side * fw * 0.70, -fh * 0.05,
        side * fw * 0.66, -fh * 0.28
      );
      c.quadraticCurveTo(
        side * fw * 0.44, -fh * 0.08,
        side * fw * 0.26, -fh * 0.02
      );
      c.closePath();
      c.fill();

      c.strokeStyle = 'rgba(20,60,10,0.45)';
      c.lineWidth = Math.max(1.2, fw * 0.008);
      c.beginPath();
      c.moveTo(side * fw * 0.34, fh * 0.02);
      c.quadraticCurveTo(side * fw * 0.55, -fh * 0.10, side * fw * 0.62, -fh * 0.28);
      c.stroke();
    }
  });

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    c.strokeStyle = 'rgba(30,60,15,0.85)';
    c.lineWidth = Math.max(3, fw * 0.025);
    c.lineCap = 'round';
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.beginPath();
      c.moveTo(ep.x - fw * 0.10, ep.y - fh * 0.08);
      c.quadraticCurveTo(ep.x, ep.y - fh * 0.10, ep.x + fw * 0.10, ep.y - fh * 0.06);
      c.stroke();
    }

    const np = toLocal(fc.nose, fc);
    c.fillStyle = earColor;
    c.beginPath();
    c.ellipse(np.x, np.y + fh * 0.02, fw * 0.06, fh * 0.07, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(20,50,10,0.6)';
    for (const side of [-1, 1]) {
      c.beginPath();
      c.ellipse(np.x + side * fw * 0.02, np.y + fh * 0.05, fw * 0.008, fh * 0.012, 0, 0, Math.PI * 2);
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = 'rgba(30,20,10,0.85)';
    c.lineWidth = Math.max(2, fw * 0.014);
    c.beginPath();
    c.moveTo(mp.x - fw * 0.20, mp.y);
    c.quadraticCurveTo(mp.x, mp.y + fh * 0.08, mp.x + fw * 0.20, mp.y);
    c.stroke();
  });
}

/* ------------------------------ Esqueleto ------------------------------ */
function drawSkeleton(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha = 0.55 * I;
    c.fillStyle = mixHex(color, '#f0ead8', 0.85);
    c.beginPath();
    c.ellipse(0, 0, fw * 0.55, fh * 0.55, 0, 0, Math.PI * 2);
    c.fill();

    c.globalAlpha = I;
    c.fillStyle = '#0a0a0a';
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.beginPath();
      c.ellipse(ep.x, ep.y, fw * 0.12, fh * 0.09, 0, 0, Math.PI * 2);
      c.fill();
    }

    const np = toLocal(fc.nose, fc);
    c.beginPath();
    c.moveTo(np.x, np.y - fh * 0.05);
    c.lineTo(np.x - fw * 0.05, np.y + fh * 0.06);
    c.lineTo(np.x + fw * 0.05, np.y + fh * 0.06);
    c.closePath();
    c.fill();

    const mp = toLocal(fc.mouth, fc);
    c.fillStyle = mixHex(color, '#f0ead8', 0.85);
    c.strokeStyle = '#222';
    c.lineWidth = Math.max(2, fw * 0.02);
    const tw = fw * 0.45;
    const th = fh * 0.15;
    c.fillRect(mp.x - tw / 2, mp.y - th / 2, tw, th);
    c.strokeRect(mp.x - tw / 2, mp.y - th / 2, tw, th);
    for (let i = 1; i < 6; i++) {
      const x = mp.x - tw / 2 + (tw / 6) * i;
      c.beginPath(); c.moveTo(x, mp.y - th / 2); c.lineTo(x, mp.y + th / 2); c.stroke();
    }
  });
}

/* -------------------------------- Alien -------------------------------- */
function drawAlien(c, p, fc, color, I) {
  const fw = fc.fw;
  const fh = fc.fh;

  withFace(c, fc, () => {
    c.globalAlpha *= I;

    const skinColor = mixHex(color, '#8fd67a', 0.55);
    const skinDark  = mixHex(color, '#3a5a30', 0.55);
    const skinLight = mixHex(color, '#d4f0c0', 0.55);

    const headGrd = c.createRadialGradient(
      -fw * 0.15, -fh * 0.20, fw * 0.10,
      0, 0, fw * 0.65
    );
    headGrd.addColorStop(0, skinLight);
    headGrd.addColorStop(0.55, skinColor);
    headGrd.addColorStop(1, skinDark);

    c.fillStyle = headGrd;
    c.beginPath();
    c.ellipse(0, -fh * 0.05, fw * 0.62, fh * 0.68, 0, 0, Math.PI * 2);
    c.fill();

    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      c.save();
      c.translate(ep.x, ep.y);
      c.rotate(ep.x < 0 ? -0.35 : 0.35);
      c.fillStyle = '#0a0a10';
      c.beginPath();
      c.ellipse(0, 0, fw * 0.17, fh * 0.10, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = 'rgba(255,255,255,0.55)';
      c.beginPath();
      c.ellipse(-fw * 0.05, -fh * 0.03, fw * 0.035, fh * 0.022, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    const np = toLocal(fc.nose, fc);
    c.fillStyle = 'rgba(20,40,15,0.85)';
    for (const side of [-1, 1]) {
      c.beginPath();
      c.ellipse(np.x + side * fw * 0.025, np.y + fh * 0.02, fw * 0.008, fh * 0.018, 0, 0, Math.PI * 2);
      c.fill();
    }

    const mp = toLocal(fc.mouth, fc);
    c.strokeStyle = 'rgba(20,40,15,0.9)';
    c.lineWidth = Math.max(1.5, fw * 0.012);
    c.beginPath();
    c.moveTo(mp.x - fw * 0.08, mp.y);
    c.lineTo(mp.x + fw * 0.08, mp.y);
    c.stroke();

    c.strokeStyle = 'rgba(40,80,30,0.45)';
    c.lineWidth = Math.max(1.5, fw * 0.010);
    c.beginPath();
    c.ellipse(0, -fh * 0.05, fw * 0.62, fh * 0.68, 0, 0, Math.PI * 2);
    c.stroke();
  });
}

/* ------------------------------ Olhos Glow ----------------------------- */
function drawGlow(c, p, fc, color, I) {
  const fw = fc.fw;

  withFace(c, fc, () => {
    c.globalAlpha = I;
    for (const e of [fc.eyes.left, fc.eyes.right]) {
      const ep = toLocal(e, fc);
      const g = c.createRadialGradient(ep.x, ep.y, 1, ep.x, ep.y, fw * 0.20);
      g.addColorStop(0, rgba(color, 1));
      g.addColorStop(0.5, rgba(color, 0.5));
      g.addColorStop(1, rgba(color, 0));
      c.fillStyle = g;
      c.beginPath();
      c.arc(ep.x, ep.y, fw * 0.20, 0, Math.PI * 2);
      c.fill();
    }
  });
}

/* =========================================================================
   Captura
   ========================================================================= */
$btnCapture.addEventListener('click', async () => {
  if (state.capturing) return;
  state.capturing = true;
  $btnCapture.disabled = true;

  try {
    if (state.timer > 0) await runCountdown(state.timer);
    await doCapture();
  } catch (err) {
    console.error('[capture]', err);
    toast('Falha ao capturar a foto.', true);
  } finally {
    state.capturing = false;
    $btnCapture.disabled = false;
  }
});

function runCountdown(n) {
  return new Promise((resolve) => {
    let count = n;
    $countdown.classList.add('show');
    $countdown.textContent = String(count);
    const tick = () => {
      count--;
      if (count > 0) {
        $countdown.textContent = String(count);
        $countdown.classList.remove('show');
        void $countdown.offsetWidth;
        $countdown.classList.add('show');
        setTimeout(tick, 1000);
      } else {
        $countdown.classList.remove('show');
        resolve();
      }
    };
    setTimeout(tick, 1000);
  });
}

function computeOutputSize(srcW, srcH) {
  const longSide = Math.max(srcW, srcH);
  const shortSide = Math.min(srcW, srcH);
  let scale = 1;

  if (longSide > CAPTURE_MAX_SIDE) {
    scale = CAPTURE_MAX_SIDE / longSide;
  }
  if (shortSide * scale < MIN_CAPTURE_SHORT_SIDE) {
    const up = MIN_CAPTURE_SHORT_SIDE / shortSide;
    scale = Math.min(Math.max(scale, up), CAPTURE_MAX_SIDE / longSide || up);
  }

  return {
    width: Math.max(1, Math.round(srcW * scale)),
    height: Math.max(1, Math.round(srcH * scale))
  };
}

async function snapshotFrame() {
  if (state.staticImage) {
    const img = state.staticImage;
    return { source: img, srcW: img.width, srcH: img.height };
  }
  if ($video.videoWidth && $video.videoHeight) {
    try {
      const bmp = await createImageBitmap($video);
      return { source: bmp, srcW: bmp.width, srcH: bmp.height, bitmap: true };
    } catch {
      return { source: $video, srcW: $video.videoWidth, srcH: $video.videoHeight };
    }
  }
  return null;
}

async function doCapture() {
  const snap = await snapshotFrame();
  if (!snap) {
    toast('Sem imagem para capturar', true);
    return;
  }

  const { width: outW, height: outH } = computeOutputSize(snap.srcW, snap.srcH);

  const out = document.createElement('canvas');
  out.width = outW;
  out.height = outH;
  const octx = out.getContext('2d', { alpha: false });
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.fillStyle = '#000';
  octx.fillRect(0, 0, outW, outH);

  const fit = fitCover(snap.srcW, snap.srcH, outW, outH);

  octx.save();
  if (state.mirror) {
    octx.translate(outW, 0);
    octx.scale(-1, 1);
  }
  try {
    octx.drawImage(snap.source, fit.dx, fit.dy, fit.dw, fit.dh);
  } catch (err) {
    console.error('[doCapture] drawImage falhou', err);
    if (snap.bitmap) snap.source.close?.();
    toast('Falha ao desenhar a foto.', true);
    return;
  }
  octx.restore();

  if (snap.bitmap) snap.source.close?.();

  if (state.faces.length > 0) {
    for (const face of state.faces) {
      const pts = landmarksToStage(face, snap.srcW, snap.srcH, outW, outH, state.mirror);
      drawFilter(octx, pts, outW, outH, state);
    }
  } else {
    toast('Nenhum rosto detectado — salvando sem filtro', true);
  }

  $flash.classList.remove('fire');
  void $flash.offsetWidth;
  $flash.classList.add('fire');

  const dataUrl = out.toDataURL('image/png');
  showResult(dataUrl);
}

function showResult(dataUrl) {
  $resultImg.src = dataUrl;
  $resultImg.dataset.url = dataUrl;
  $resultModal.classList.add('open');
  document.getElementById('btn-download').focus({ preventScroll: true });
}

function closeResult() {
  $resultModal.classList.remove('open');
  $resultImg.removeAttribute('src');
  delete $resultImg.dataset.url;
}

document.getElementById('btn-download').addEventListener('click', () => {
  const url = $resultImg.dataset.url;
  if (!url) return;
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.download = `fantasia-${stamp}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Download iniciado');
});

document.getElementById('btn-again').addEventListener('click', closeResult);
document.getElementById('btn-close-result').addEventListener('click', closeResult);

$resultModal.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeResult();
});

/* ------------------------------- Init ---------------------------------- */
window.addEventListener('beforeunload', stopCamera);
window.addEventListener('pagehide', stopCamera);

if (location.protocol === 'file:') {
  setTimeout(() => {
    if (!state.running) {
      toast('Para a câmera funcionar, abra via https:// ou http://localhost', true);
    }
  }, 900);
}
